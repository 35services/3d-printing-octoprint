# Both instances use the local image from ./Dockerfile (OctoPrint + PrusaSlicer).
# Rebuild after upstream updates: docker compose build --pull
#
# Devices: instead of mapping one printer/camera device per container (Docker
# refuses to start a container whose mapped device doesn't exist yet, e.g. a
# printer that is switched off at boot), each instance sees the host's /dev but
# may only open serial (major 166, ttyACM*) and video (major 81) devices. The
# instance is pinned to its printer by model via PRINTER_PORT_GLOB (see
# printer-port.sh), and to its camera via the stable /dev/v4l/by-id name. A
# printer switched on later shows up in OctoPrint's port list; click Connect.
x-device-rules: &device-rules
  - "c 166:* rmw"
  - "c 81:* rmw"

services:
  # MK4 with the Logitech C920, on :92 (proxied as /octoprint-mk4). Since the
  # printers were physically swapped, this service's data volume (formerly the
  # MK3 instance's) belongs to the MK4.
  octoprint:
    build: .
    image: octoprint-prusaslicer:latest
    restart: unless-stopped
    ports:
      - "92:80"
    volumes:
      - octoprint_data:/octoprint
      - /dev:/dev
    device_cgroup_rules: *device-rules
    environment:
      - PRINTER_PORT_GLOB=/dev/serial/by-id/*Original_Prusa_MK4*
      - ENABLE_MJPG_STREAMER=true
      - CAMERA_DEV=/dev/v4l/by-id/usb-046d_HD_Pro_Webcam_C920_27180D6F-video-index0
      # C920: full 1080p, 10 fps keeps the MJPEG stream light over Wi-Fi/Tailscale.
      - MJPG_STREAMER_INPUT=-n -r 1920x1080 -f 10
      - SLIC3R_DEFAULT_PROFILE=prusa_mk4_pla

  # MK3 with the Logitech C505e, on :91 (proxied as /octoprint-mk3). Its data
  # volume (formerly the MK4 instance's) belongs to the MK3.
  octoprint-mk4:
    build: .
    image: octoprint-prusaslicer:latest
    restart: unless-stopped
    ports:
      - "91:80"
    volumes:
      - octoprint_mk4_data:/octoprint
      - /dev:/dev
    device_cgroup_rules: *device-rules
    environment:
      - PRINTER_PORT_GLOB=/dev/serial/by-id/*Original_Prusa_i3_MK3*
      - ENABLE_MJPG_STREAMER=true
      - CAMERA_DEV=/dev/v4l/by-id/usb-046d_C505e_HD_Webcam_4FAEC740-video-index0
      # C505e: 720p sensor; 10 fps keeps the MJPEG stream light over Wi-Fi/Tailscale.
      - MJPG_STREAMER_INPUT=-n -r 1280x720 -f 10
      - SLIC3R_DEFAULT_PROFILE=prusa_mk3_pla

volumes:
  octoprint_data:
  octoprint_mk4_data:
